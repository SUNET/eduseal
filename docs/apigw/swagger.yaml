basePath: /api/v1
definitions:
  apiv1.PDFGetSignedReply:
    properties:
      data:
        $ref: '#/definitions/model.Document'
    type: object
  apiv1.PDFSignReply:
    properties:
      data:
        $ref: '#/definitions/v1_sealer.SealReply'
    type: object
  apiv1.PDFSignRequest:
    properties:
      pdf:
        type: string
    required:
    - pdf
    type: object
  apiv1.PDFValidateReply:
    properties:
      data:
        $ref: '#/definitions/v1_validator.ValidateReply'
    type: object
  apiv1.PDFValidateRequest:
    properties:
      pdf:
        type: string
    type: object
  helpers.Error:
    properties:
      details: {}
      title:
        type: string
    type: object
  helpers.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/helpers.Error'
    type: object
  model.Document:
    properties:
      data:
        type: string
      message:
        type: string
      reason:
        type: string
      revoked_at:
        type: integer
      sealer_backend:
        type: string
      transaction_id:
        type: string
    type: object
  v1_sealer.SealReply:
    properties:
      data:
        type: string
      error:
        type: string
      sealer_backend:
        type: string
      transaction_id:
        type: string
    type: object
  v1_validator.ValidateReply:
    properties:
      coverage:
        description: |-
          coverage indicates how much of the file is covered by the signed byte
          range. Values match pyHanko's SignatureCoverageLevel names
          (UNCLEAR, CONTIGUOUS_BLOCK_FROM_START, ENTIRE_REVISION, ENTIRE_FILE).
        type: string
      docmdp_ok:
        description: |-
          docmdp_ok reports whether the certification-policy (DocMDP) check
          succeeded. False indicates disallowed modifications were made after
          the document was sealed.
        type: boolean
      error:
        type: string
      intact_signature:
        description: |-
          intact_signature is true iff the cryptographic signature is intact AND
          the signature covers the entire file (no post-signature bytes appended).
        type: boolean
      modification_level:
        description: |-
          modification_level reports the severity of modifications made after
          signing. Values match pyHanko's ModificationLevel names
          (NONE, LTA_UPDATES, FORM_FILLING, ANNOTATIONS, OTHER).
        type: string
      transaction_id:
        type: string
      valid_signature:
        description: |-
          valid_signature is true iff the signature passes pyHanko's overall
          trust judgment (bottom_line): signer chain trusted, DocMDP policy
          satisfied and no disallowed modifications were made after signing.
        type: boolean
      validation_backend:
        type: string
    type: object
info:
  contact: {}
  title: EduSeal API
  version: 0.1.0
paths:
  /pdf/{transaction_id}:
    get:
      consumes:
      - application/json
      description: fetch a sealed pdf
      operationId: pdf-fetch
      parameters:
      - description: transaction_id
        in: path
        name: transaction_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/apiv1.PDFGetSignedReply'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
      summary: fetch sealed pdf
      tags:
      - EduSeal
  /pdf/sign:
    post:
      consumes:
      - application/json
      description: seal base64 encoded PDF
      operationId: pdf-seal
      parameters:
      - description: ' '
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/apiv1.PDFSignRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/apiv1.PDFSignReply'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
      summary: Seal pdf
      tags:
      - EduSeal
  /pdf/validate:
    post:
      consumes:
      - application/json
      description: validate a sealed base64 encoded PDF
      operationId: pdf-validate
      parameters:
      - description: ' '
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/apiv1.PDFValidateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            $ref: '#/definitions/apiv1.PDFValidateReply'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/helpers.ErrorResponse'
      summary: Validate pdf
      tags:
      - EduSeal
swagger: "2.0"
