// Jenkinsfile for eduseal
// Triggered by tag pushes:
//   v<major>.<minor>.<patch>          — build + push all services (tagged <version> + testing)
//   prod-v<major>.<minor>.<patch>     — promote existing images to :prod (no rebuild)
//   noctool-v<major>.<minor>.<patch>  — build noctool binary

pipeline {
    agent any

    environment {
        DOCKER_REGISTRY = 'docker.sunet.se/eduseal'
    }

    stages {
        stage('Parse Tag') {
            steps {
                script {
                    env.GIT_TAG = env.TAG_NAME ?: sh(
                        script: 'git describe --tags --exact-match 2>/dev/null || echo ""',
                        returnStdout: true
                    ).trim()

                    if (!env.GIT_TAG) {
                        echo "No tag found — skipping."
                        currentBuild.result = 'NOT_BUILT'
                        return
                    }

                    // Check for prod promotion tag: prod-vX.Y.Z
                    def prodMatcher = (env.GIT_TAG =~ /^prod-v(\d+\.\d+\.\d+)$/)
                    if (prodMatcher.matches()) {
                        env.PROMOTE  = 'true'
                        env.VERSION  = "v${prodMatcher[0][1]}"
                        echo "Prod promotion: ${env.VERSION} -> prod"
                        return
                    }

                    // Check for release tag: vX.Y.Z
                    def relMatcher = (env.GIT_TAG =~ /^v(\d+\.\d+\.\d+)$/)
                    if (relMatcher.matches()) {
                        env.PROMOTE  = 'false'
                        env.VERSION  = env.GIT_TAG
                        echo "Release build: ${env.VERSION}"
                        return
                    }

                    // Check for noctool tag: noctool-vX.Y.Z
                    def noctoolMatcher = (env.GIT_TAG =~ /^noctool-v(\d+\.\d+\.\d+)$/)
                    if (noctoolMatcher.matches()) {
                        env.NOCTOOL  = 'true'
                        env.VERSION  = "v${noctoolMatcher[0][1]}"
                        echo "Noctool build: ${env.VERSION}"
                        return
                    }

                    echo "Tag '${env.GIT_TAG}' not recognized — skipping."
                    currentBuild.result = 'NOT_BUILT'
                }
            }
        }

        stage('Build Docker Images') {
            when { expression { env.VERSION != null && env.PROMOTE == 'false' } }
            parallel {
                stage('apigw') {
                    steps {
                        sh """
                            docker build \
                                --build-arg SERVICE_NAME=apigw \
                                --build-arg VERSION=${env.VERSION} \
                                --tag ${DOCKER_REGISTRY}/apigw:${env.VERSION} \
                                --tag ${DOCKER_REGISTRY}/apigw:testing \
                                --file docker/worker .
                        """
                    }
                }
                stage('sealer') {
                    steps {
                        sh """
                            docker build \
                                --tag ${DOCKER_REGISTRY}/sealer_lunahsm:${env.VERSION} \
                                --tag ${DOCKER_REGISTRY}/sealer_lunahsm:testing \
                                --file docker/sealer/lunahsm/Dockerfile .
                        """
                    }
                }
                stage('validator') {
                    steps {
                        sh """
                            docker build \
                                --tag ${DOCKER_REGISTRY}/validator:${env.VERSION} \
                                --tag ${DOCKER_REGISTRY}/validator:testing \
                                --file docker/validator/Dockerfile .
                        """
                    }
                }
            }
        }

        stage('Push Docker Images') {
            when { expression { env.VERSION != null && env.PROMOTE == 'false' } }
            steps {
                sh """
                    docker push ${DOCKER_REGISTRY}/apigw:${env.VERSION}
                    docker push ${DOCKER_REGISTRY}/apigw:testing

                    docker push ${DOCKER_REGISTRY}/sealer_lunahsm:${env.VERSION}
                    docker push ${DOCKER_REGISTRY}/sealer_lunahsm:testing

                    docker push ${DOCKER_REGISTRY}/validator:${env.VERSION}
                    docker push ${DOCKER_REGISTRY}/validator:testing
                """
            }
        }

        stage('Promote to Prod') {
            when { expression { env.VERSION != null && env.PROMOTE == 'true' } }
            steps {
                sh """
                    for img in apigw sealer_lunahsm validator; do
                        echo "Pulling \${img}:${env.VERSION}..."
                        docker pull ${DOCKER_REGISTRY}/\${img}:${env.VERSION}

                        docker tag ${DOCKER_REGISTRY}/\${img}:${env.VERSION} ${DOCKER_REGISTRY}/\${img}:prod

                        echo "Pushing \${img}:prod..."
                        docker push ${DOCKER_REGISTRY}/\${img}:prod
                        echo ""
                    done
                """
            }
        }
        stage('Build Noctool') {
            when { expression { env.NOCTOOL == 'true' } }
            steps {
                sh """
                    GIT_COMMIT=\$(git rev-parse --short HEAD)
                    BUILD_DATE=\$(date -u +'%Y-%m-%dT%H:%M:%SZ')
                    go build \
                        -ldflags "-w -s --extldflags '-static' -X main.GitCommit=\${GIT_COMMIT} -X main.BuildDate=\${BUILD_DATE} -X main.Version=${env.VERSION}" \
                        -o bin/noctool ./cmd/noctool
                """
                archiveArtifacts artifacts: 'bin/noctool', fingerprint: true
            }
        }
    }

    post {
        success {
            script {
                if (env.PROMOTE == 'true') {
                    echo "Promoted ${env.VERSION} to prod successfully."
                } else if (env.NOCTOOL == 'true') {
                    echo "Built noctool ${env.VERSION} successfully."
                } else {
                    echo "Released all services at ${env.VERSION} successfully."
                }
            }
        }
        failure {
            echo "Pipeline failed for ${env.GIT_TAG}!"
        }
    }
}
