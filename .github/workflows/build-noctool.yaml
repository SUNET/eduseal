name: Build noctool

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build noctool
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build noctool
        env:
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -ldflags "-w -s --extldflags '-static'" \
            -o bin/noctool \
            ./cmd/noctool

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: noctool
          path: bin/noctool
