name: Release noctool

on:
  push:
    tags:
      - "noctool-v*"

permissions:
  contents: write

jobs:
  build:
    name: Build noctool (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build noctool
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -ldflags "-w -s --extldflags '-static' -X main.Version=${GITHUB_REF_NAME} -X main.GitCommit=$(git rev-parse --short HEAD) -X main.BuildDate=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            -o noctool-${{ matrix.goos }}-${{ matrix.goarch }} \
            ./tools/noctool

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: noctool-${{ matrix.goos }}-${{ matrix.goarch }}
          path: noctool-${{ matrix.goos }}-${{ matrix.goarch }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum noctool-* > checksums-sha256.txt

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#noctool-}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "noctool ${{ steps.version.outputs.version }}"
          generate_release_notes: true
          files: |
            artifacts/noctool-*
            artifacts/checksums-sha256.txt
